name: Sincronizar Evidencias de PR para GitPages

on:
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número do Pull Request para sincronizar evidências"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  sync-evidencias:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch alvo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar imagens e atualizar DoD no MkDocs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}"
          python3 .github/scripts/sync_pr_evidencias.py --repo "${{ github.repository }}" --pr "$PR_NUM"

      - name: Commit e push das evidências sincronizadas
        run: |
          if [ -z "$(git status --porcelain docs/)" ]; then
            echo "Nenhuma alteração de evidência para commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/images/evidencias/ docs/mvp/dod.md
          PR_NUM="${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}"
          git commit -m "docs(evidencias): sincroniza evidencias do PR #${PR_NUM} [skip ci]"
          git push
