    - 'Entrega 1 (Ponto de Controle 1)': entregas/entrega-1.md
    - 'Entrega 2 (Ponto de Controle 2)': entregas/entrega-2.md
    - 'Entrega 3 (Ponto de Controle 3)': entregas/entrega-3.md
    - 'Entrega 4 (Ponto de Controle 4)': entregas/entrega-4.md



