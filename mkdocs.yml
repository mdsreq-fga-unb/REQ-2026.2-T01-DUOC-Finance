site_name: Cascata Ágil
site_description: Documentação de Requisitos de Software — DUOC Arquitetura e Engenharia
site_author: Equipe Cascata Ágil

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
  features:
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/css/extra.css

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 90%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: true
      caption_position: bottom

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 2
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list



extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js


nav:
  - Home: index.md
  - 'Capítulo 1 - Cenário Atual': visao-produto/capitulo-1/index.md
  - 'Capítulo 2 - Solução Proposta': visao-produto/capitulo-2/index.md
  - 'Capítulo 3 - Intervenção Social': intervencao-social/index.md
  - 'Capítulo 4 - Estratégias de ESW': estrategias-esw/index.md
  - 'Capítulo 5 - Engenharia de Requisitos': engenharia-requisitos/index.md
  - 'Capítulo 6 - Cronograma': cronograma/index.md
  - 'Capítulo 7 - Interação com Cliente': interacao-cliente/index.md
  - 'Capítulo 8 - Requisitos (Unidade 2)':
    - 'Visão geral': requisitos/index.md
    - 'OE3 — Inteligência de Custos por Contrato': requisitos/mod3.md
  - 'Capítulo 9 - DoR e DoD (Unidade 2)': dor-dod/index.md
  - 'Capítulo 10 - Backlog (Unidade 2)': backlog/index.md
  - 'Capítulo 11 - Lições Aprendidas': licoes-aprendidas/index.md
  - 'Capítulo 12 - Referências': referencias/index.md
  - 'Atas de Reuniões': atas/index.md
  - 'Entregas do Projeto':
