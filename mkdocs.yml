site_name: Cascata Ágil
site_description: Documentação de Requisitos de Software — DUOC Arquitetura e Engenharia
site_author: Equipe Cascata Ágil

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list

nav:
  - Início: index.md
  - Visão do Produto e Projeto:
      - Visão Geral: visao-produto/index.md
      - 1. Cenário Atual do Cliente e do Negócio: visao-produto/cap-1.md
      - 1.4 Problema e Diagrama de Ishikawa: visao-produto/capitulo-1/1.4-problema-ishikawa.md
      - 2. Solução Proposta: visao-produto/cap-2.md